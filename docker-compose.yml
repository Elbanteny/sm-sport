version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: sm-sport-center-app
        container_name: sm_sport_app
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
        environment:
            - DB_HOST=db
        networks:
            - sm_sport_network
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: sm_sport_db
        ports:
            - "3306:3306"
        environment:
            - MYSQL_DATABASE=${DB_DATABASE:-sm_sport_center}
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
            - MYSQL_PASSWORD=${DB_PASSWORD:-root}
        volumes:
            - sm_sport_db_data:/var/lib/mysql
        networks:
            - sm_sport_network

networks:
    sm_sport_network:
        driver: bridge

volumes:
    sm_sport_db_data:
        driver: local
